<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TIPped interactive logo preview</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, "Segoe UI", sans-serif; background: #0F172A; color: #CBD5E1; }
    * { box-sizing: border-box; }
    body { display: grid; min-height: 100vh; margin: 0; place-items: center; overflow: hidden; background: radial-gradient(ellipse at 50% 48%, rgba(245,158,11,.08), transparent 43%), #0F172A; }
    main { width: min(1000px, calc(100vw - 32px)); text-align: center; }
    .logo-stage { display: block; width: 100%; padding: 0; border: 0; outline: 0; background: transparent; }
    .logo-art { display: block; width: 100%; height: auto; overflow: visible; }
    .logo-frame { transition: stroke 240ms ease; }
    .focus-corner { transform-box: fill-box; transform-origin: center; transition: transform 240ms cubic-bezier(.2,.75,.25,1), filter 240ms ease; }
    .logo-detail { transform-box: fill-box; transform-origin: center; }
    .logo-stage:hover .logo-frame, .logo-stage:focus-visible .logo-frame { stroke: #FBBF24; }
    .logo-stage:hover .corner-tl, .logo-stage:focus-visible .corner-tl { transform: translate(-2px,-2px); }
    .logo-stage:hover .corner-tr, .logo-stage:focus-visible .corner-tr { transform: translate(2px,-2px); }
    .logo-stage:hover .corner-bl, .logo-stage:focus-visible .corner-bl { transform: translate(-2px,2px); }
    .logo-stage:hover .corner-br, .logo-stage:focus-visible .corner-br { transform: translate(2px,2px); }
    .logo-stage:hover .icon-hvac, .logo-stage:focus-visible .icon-hvac { animation: hvac-sway 1.6s ease-in-out infinite alternate; }
    .logo-stage:hover .icon-bolt, .logo-stage:focus-visible .icon-bolt { animation: bolt-bob 1.05s ease-in-out .1s infinite; }
    .logo-stage:hover .icon-chemical, .logo-stage:focus-visible .icon-chemical { animation: flask-rock 1.7s ease-in-out .2s infinite alternate; }
    .logo-stage:hover .icon-flame, .logo-stage:focus-visible .icon-flame { animation: flame-flicker .8s ease-in-out .3s infinite alternate; }
    .logo-stage:focus-visible { border-radius: 24px; outline: 2px solid rgba(245,158,11,.65); outline-offset: 10px; }
    p { margin: 24px 0 0; color: #94A3B8; font-size: .9rem; letter-spacing: .03em; }
    @keyframes hvac-sway { from { transform: rotate(-2deg) translateY(0); } to { transform: rotate(2deg) translateY(-1px); } }
    @keyframes bolt-bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-1.5px) scale(1.04); } }
    @keyframes flask-rock { from { transform: rotate(-2deg); } to { transform: rotate(2deg); } }
    @keyframes flame-flicker { from { transform: scale(.96); } to { transform: scale(1.04); } }
    @media (max-width: 600px) { main { width: calc(100vw - 20px); } p { margin-top: 14px; font-size: .78rem; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
  <main>
    <div class="logo-stage" tabindex="0" role="img" aria-label="TIPped logo. Hover or focus to see the focus corners and hazard icons move.">
      <svg class="logo-art" xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
  <title id="title">TIPped typography study: Bahnschrift SemiBold</title>
  <desc id="desc">A yellow focus frame around a larger location pin and compact T.I.P. badge, balanced by four minimal facility hazard icons: air conditioning, electrical, chemical, and physical.</desc>
  <rect width="900" height="300" rx="24" fill="#0F172A"/>
  <g transform="translate(210 85)" stroke-linecap="round" stroke-linejoin="round">
    <path class="logo-frame focus-corner corner-tl" d="M36 7H7v29" fill="none" stroke="#F59E0B" stroke-width="7"/><path class="logo-frame focus-corner corner-tr" d="M94 7h29v29" fill="none" stroke="#F59E0B" stroke-width="7"/><path class="logo-frame focus-corner corner-bl" d="M7 94v29h29" fill="none" stroke="#F59E0B" stroke-width="7"/><path class="logo-frame focus-corner corner-br" d="M123 94v29H94" fill="none" stroke="#F59E0B" stroke-width="7"/>
    <g class="logo-pin"><path d="M65 110C55 98 33 76 33 56a32 32 0 1 1 64 0c0 20-22 42-32 54Z" fill="#F59E0B"/>
    <rect x="44" y="40" width="42" height="36" rx="2" fill="#C4C7CC" stroke="#0F172A" stroke-width="1.5"/>
    <path d="M44 40h42v4H44z" fill="#F59E0B" stroke="none"/>
    <path d="M44 44h42v4H44zM44 68h42v8H44z" fill="#0F172A" stroke="none"/>
    <text x="65" y="63" text-anchor="middle" fill="#0F172A" font-family="Inter, Segoe UI, sans-serif" font-size="14" font-weight="900" letter-spacing="-.5" stroke="none">T.I.P.</text>
    <path d="M53 72h24" fill="none" stroke="#F59E0B" stroke-width="1.3"/></g>
    <g transform="translate(10 39) scale(1.2)"><g class="logo-detail icon-hvac" fill="none" stroke="#F8FAFC" stroke-width="1.25">
      <rect x=".8" y="1" width="12.4" height="6" rx="1.3"/>
      <path d="M3 4h8M3.5 9c-.8.6.8 1.2 0 2.3M7 9c-.8.6.8 1.2 0 2.3M10.5 9c-.8.6.8 1.2 0 2.3"/>
      <path d="M3.5 5.6h7" stroke="#F59E0B"/>
    </g></g>
    <g transform="translate(104 39) scale(1.2)"><g class="logo-detail icon-bolt">
      <path d="M8.6 .7 3.2 7h3.1l-1 5.7L10.8 6H7.6Z" fill="#F8FAFC"/>
      <path d="M8.6 .7 3.2 7h3.1l-1 5.7L10.8 6H7.6Z" fill="none" stroke="#0F172A" stroke-width=".55"/>
    </g></g>
    <g transform="translate(10 75) scale(1.2)"><g class="logo-detail icon-chemical" fill="none" stroke="#F8FAFC" stroke-width="1.25">
      <path d="M4 1h6M5.5 1v3L2.2 10a1.2 1.2 0 0 0 1 1.8h7.6a1.2 1.2 0 0 0 1-1.8L9 4V1M3.8 8h7"/>
      <path d="M4.5 9.6h5.8" stroke="#F59E0B"/>
    </g></g>
    <g transform="translate(104 75) scale(1.2)"><g class="logo-detail icon-flame">
      <path d="M8 1C8 4 5 4.7 5 7c0 1 .7 1.7.7 1.7S4 7.8 3 6.5C2 8 2 10 3.5 11.4c.8.8 1.8 1.1 3 1.1 3.5 0 5.8-2.2 5.8-5.2C12.3 4.8 10.8 2.8 8 1Z" fill="none" stroke="#F8FAFC" stroke-width="1.25"/>
      <path d="M7.1 7.2c-1.3 1.5-.8 3 0 3.6 1.1-.4 1.8-1.2 1.8-2.4 0-.8-.4-1.4-1-2-.1.4-.4.6-.8.8Z" fill="#F59E0B"/>
    </g></g>
  </g>
  <text class="logo-wordmark" x="395" y="176" font-family="Bahnschrift SemiBold" font-size="92" font-weight="400" letter-spacing="-4">
    <tspan fill="#F59E0B">TIP</tspan><tspan fill="#CBD5E1">ped</tspan>
  </text>
</svg>

    </div>
    <p>Hover or focus the frame and small icons</p>
  </main>

</body>
</html>
