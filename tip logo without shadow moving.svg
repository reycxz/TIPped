<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="TIPped logo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .br{transform-box:fill-box;transform-origin:center;opacity:0;animation:lock 7s cubic-bezier(.2,.8,.2,1) infinite}
    .tl{--x:-34px;--y:-34px}
    .tr{--x:34px;--y:-34px}
    .bl{--x:-34px;--y:34px}
    .brr{--x:34px;--y:34px}
    .pin{transform-box:fill-box;transform-origin:50% 100%;animation:pin 7s cubic-bezier(.2,.8,.2,1) infinite}
    .fig{transform-box:fill-box;transform-origin:center;animation:fig 7s cubic-bezier(.2,.8,.2,1) infinite}
    @keyframes lock{
      0%{opacity:0;transform:translate(var(--x),var(--y))}
      8%{opacity:1}
      20%{opacity:1;transform:translate(calc(var(--x) * -.1),calc(var(--y) * -.1))}
      26%,88%{opacity:1;transform:translate(0,0)}
      94%{opacity:1;transform:translate(calc(var(--x) * .22),calc(var(--y) * .22))}
      100%{opacity:1;transform:translate(0,0)}
    }
    @keyframes pin{
      0%{opacity:.35;transform:scale(.9)}
      22%{opacity:1;transform:scale(1.03)}
      30%,100%{opacity:1;transform:scale(1)}
    }
    @keyframes fig{
      0%,12%{opacity:0;transform:scale(.6)}
      28%{opacity:1;transform:scale(1.08)}
      36%,100%{opacity:1;transform:scale(1)}
    }
    @media (prefers-reduced-motion:reduce){
      .br,.pin,.fig{animation:none;opacity:1;transform:none}
    }
  </style>
  <defs>
    <linearGradient id="gp" x1="0.1" y1="0.05" x2="0.9" y2="0.95">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#D97706"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" rx="40" fill="#0F172A"/>
  <g fill="none" stroke="#F59E0B" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
    <path class="br tl" d="M66 140V76a10 10 0 0 1 10-10h64"/>
    <path class="br tr" d="M260 66h64a10 10 0 0 1 10 10v64"/>
    <path class="br bl" d="M66 260v64a10 10 0 0 0 10 10h64"/>
    <path class="br brr" d="M260 334h64a10 10 0 0 0 10-10v-64"/>
  </g>
  <path class="pin" d="M200 92C154 92 118 128 118 174c0 52 56 100 82 126 26-26 82-74 82-126 0-46-36-82-82-82z" fill="url(#gp)"/>
  <g class="fig" transform="translate(0 -4)" fill="#0F172A">
    <circle cx="200" cy="154" r="15"/>
    <path d="M180 238V204a20 20 0 0 1 40 0v34a8 8 0 0 1-8 8h-24a8 8 0 0 1-8-8z"/>
  </g>
</svg>
